name: crypto-research

on:
  schedule:
    # Observe about a minute into five-minute windows. Actual gaps are archived.
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [forecast-pass, market-openings, shadow-observer, contract-consistency]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/crypto.yml'
      - 'scripts/crypto.js'
      - 'scripts/crypto-freshness.js'
      - 'scripts/crypto/**'
      - 'tools/crypto.test.js'

permissions:
  contents: write

concurrency:
  group: crypto-research
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event.repository.private == false && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Keep the large weather archive out of each five-minute checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/crypto.js
            /scripts/crypto-freshness.js
            /scripts/crypto/
            /tools/crypto.test.js
            /docs/data/crypto/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check crypto snapshot freshness
        id: freshness
        env:
          CRYPTO_TRIGGER: ${{ github.event_name }}
        run: node scripts/crypto-freshness.js
      - name: Verify crypto models and paper accounting
        if: steps.freshness.outputs.needed == 'true'
        run: node --test tools/crypto.test.js
      - name: Collect BTC and ETH five- and fifteen-minute markets
        if: steps.freshness.outputs.needed == 'true'
        run: node scripts/crypto.js
      - name: Publish crypto research archive
        if: ${{ always() && steps.freshness.outputs.needed == 'true' }}
        run: |
          set -eu
          if [ ! -d docs/data/crypto ]; then exit 0; fi
          git config user.name "hightemp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/crypto
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "crypto research $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            # This workflow owns crypto data exclusively. Never resolve a real
            # conflict by discarding upstream history or force-pushing.
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              echo "Crypto data conflict; preserving upstream and stopping."
              exit 1
            fi
            sleep 3
          done
          echo "Could not publish crypto research after retries."
          exit 1
