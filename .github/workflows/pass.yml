name: forecast-pass

on:
  schedule:
    # Every 20 minutes, offset from the top of the hour when GitHub's scheduler
    # is busiest. Each run is safe to repeat, so a late or doubled run is harmless.
    - cron: "4,24,44 * * * *"
  # Recover when another collector runs but the forecast schedule was delayed.
  workflow_run:
    workflows: [market-openings, shadow-observer, nfl-rain, mlb-weather, contract-consistency]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pass.yml'
      - 'scripts/run.js'
      - 'scripts/forecast-freshness.js'
      - 'scripts/publish-forecast.js'
      - 'tools/forecast-recovery.test.js'
      - 'engine/**'
  workflow_dispatch:
    inputs:
      morning:
        description: "Force this run to be the 7am call"
        type: boolean
        default: false
      test_push:
        description: "Send a test notification to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast-pass
  cancel-in-progress: false

jobs:
  pass:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued recovery jobs must check the current snapshot, not the
          # collector's older commit. All triggers target the main branch.
          ref: main

      - name: Check whether recovery is needed
        id: freshness
        env:
          TRIGGER: ${{ github.event_name }}
        run: node scripts/forecast-freshness.js

      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.needed == 'true'
        with:
          node-version: 22

      - name: Verify forecast recovery
        if: steps.freshness.outputs.needed == 'true'
        run: node --test tools/forecast-recovery.test.js

      # Python only runs on GitHub's server. Nothing needs to be installed
      # on your own computer.
      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.needed == 'true'
        with:
          python-version: "3.12"

      - name: Install free MADIS reader
        if: steps.freshness.outputs.needed == 'true'
        timeout-minutes: 1
        run: python -m pip install --disable-pip-version-check netCDF4
        continue-on-error: true

      - name: Fetch public NOAA MADIS one-minute ASOS
        if: steps.freshness.outputs.needed == 'true'
        timeout-minutes: 2
        run: |
          python scripts/fetch_madis_omo.py \
            --stations KNYC \
            --out docs/data/madis_omo.json
        # Public MADIS can lag or occasionally be unavailable. Never let that
        # stop the existing NWS/AviationWeather forecast pipeline.
        continue-on-error: true

      - name: Run the forecast pass
        if: steps.freshness.outputs.needed == 'true'
        timeout-minutes: 5
        env:
          FORCE_MORNING: ${{ inputs.morning }}
          TEST_PUSH: ${{ inputs.test_push }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/run.js

      - name: Commit results
        if: ${{ always() && steps.freshness.outputs.needed == 'true' }}
        env:
          FORCE_MORNING: ${{ inputs.morning }}
          TEST_PUSH: ${{ inputs.test_push }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/publish-forecast.js
