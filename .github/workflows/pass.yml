name: forecast-pass

on:
  schedule:
    # Every 20 minutes, offset from the top of the hour when GitHub's scheduler
    # is busiest. Each run is safe to repeat, so a late or doubled run is harmless.
    - cron: "4,24,44 * * * *"
  # Recover when another collector runs but the forecast schedule was delayed.
  workflow_run:
    workflows: [market-openings, shadow-observer, nfl-rain]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pass.yml'
      - 'scripts/run.js'
      - 'engine/**'
  workflow_dispatch:
    inputs:
      morning:
        description: "Force this run to be the 7am call"
        type: boolean
        default: false
      test_push:
        description: "Send a test notification to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast-pass
  cancel-in-progress: false

jobs:
  pass:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued recovery jobs must check the current snapshot, not the
          # collector's older commit. All triggers target the main branch.
          ref: main

      - name: Check whether recovery is needed
        id: freshness
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          let at = NaN;
          try { at = Date.parse(JSON.parse(fs.readFileSync('docs/data/latest.json', 'utf8')).ranAt); } catch (_) {}
          const ageMin = (Date.now() - at) / 60000;
          const needed = process.env.TRIGGER !== 'workflow_run' || !Number.isFinite(ageMin) || ageMin >= 18;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needed=${needed}\n`);
          console.log(needed ? `Forecast refresh needed (${ageMin.toFixed(1)} minutes old).` : `Snapshot is ${ageMin.toFixed(1)} minutes old; skip duplicate recovery.`);
          JS

      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.needed == 'true'
        with:
          node-version: 22

      # Python only runs on GitHub's server. Nothing needs to be installed
      # on your own computer.
      - uses: actions/setup-python@v5
        if: steps.freshness.outputs.needed == 'true'
        with:
          python-version: "3.12"

      - name: Install free MADIS reader
        if: steps.freshness.outputs.needed == 'true'
        run: python -m pip install --disable-pip-version-check netCDF4

      - name: Fetch public NOAA MADIS one-minute ASOS
        if: steps.freshness.outputs.needed == 'true'
        run: |
          python scripts/fetch_madis_omo.py \
            --stations KNYC \
            --out docs/data/madis_omo.json
        # Public MADIS can lag or occasionally be unavailable. Never let that
        # stop the existing NWS/AviationWeather forecast pipeline.
        continue-on-error: true

      - name: Run the forecast pass
        if: steps.freshness.outputs.needed == 'true'
        env:
          FORCE_MORNING: ${{ inputs.morning }}
          TEST_PUSH: ${{ inputs.test_push }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/run.js

      - name: Commit results
        if: ${{ always() && steps.freshness.outputs.needed == 'true' }}
        run: |
          git config user.name "hightemp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "pass $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "push failed after 3 attempts"; exit 1
