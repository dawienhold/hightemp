name: forecast-pass

on:
  schedule:
    # Every 20 minutes, offset from the top of the hour when GitHub's scheduler
    # is busiest. Each run is safe to repeat, so a late or doubled run is harmless.
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
    inputs:
      morning:
        description: "Force this run to be the 7am call"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forecast-pass
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the forecast pass
        env:
          FORCE_MORNING: ${{ inputs.morning }}
        run: node scripts/run.js

      - name: Commit results
        if: always()
        run: |
          git config user.name "hightemp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "pass $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "push failed after 3 attempts"; exit 1
